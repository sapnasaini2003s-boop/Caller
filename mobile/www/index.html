<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FacultyMe Caller</title>
<style>
  :root{color-scheme:light}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    background:#F7F5F1;color:#151C22;
    font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:24px;text-align:center;
  }
  .box{max-width:30ch}
  h1{font-size:19px;font-weight:700;margin:0 0 10px}
  p{color:#4A565F;margin:0 0 18px}
  button{
    background:#2C5670;color:#fff;border:0;border-radius:3px;
    font:600 15px/1 inherit;padding:13px 22px;cursor:pointer;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Can't reach the server</h1>
    <p>Check your internet connection, then try again. Nothing you logged has been lost.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
